[package]
name = "nub"
version = "0.1.0"
edition = "2021"
description = "Unified command-line client for the Nubster developer platform, starting with repository management."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nubster-opensources/nubster-cli"
readme = "README.md"
publish = false
rust-version = "1.88"
authors = ["Nubster"]
homepage = "https://nubster.com"
keywords = ["cli", "source-control", "developer-platform", "nubster"]
categories = ["command-line-utilities"]

[[bin]]
name = "nub"
path = "src/main.rs"

[dependencies]
anstream = "0.6"
anstyle = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
